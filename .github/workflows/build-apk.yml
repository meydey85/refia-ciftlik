name: Build Refia Ciftlik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q refia-ciftlik-project.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/refia_ciftlik_android
        run: |
          gradle assembleDebug --stacktrace

      - name: Align APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" \
          -f 4 \
          project/refia_ciftlik_android/app/build/outputs/apk/debug/app-debug.apk \
          /tmp/refia-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore /tmp/refia-ciftlik.jks \
            -storepass android \
            -keypass android \
            -alias refia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Refia Ciftlik,O=Refia Ciftlik,C=TR"

      - name: Sign APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/refia-ciftlik.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out /tmp/Refia-Ciftlik-Final.apk \
            /tmp/refia-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose /tmp/Refia-Ciftlik-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Refia-Ciftlik-Final-APK
          path: /tmp/Refia-Ciftlik-Final.apk
          if-no-files-found: error
